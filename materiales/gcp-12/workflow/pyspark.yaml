main:
  steps:
    - ejecutar-job:
        call: http.post
        args:
          url: "https://dataproc.googleapis.com/v1/projects/western-trilogy-429606-h1/regions/us-central1/jobs:submit"
          headers:
            Content-Type: application/json
            Authorization: ${"Bearer " + access_token}
          body: 
            job:
              placement:
                clusterName: "sd-consola-dataproc-01"
              pysparkJob:
                mainPythonFileUri: "gs://sd-gcolab-bucket-1/transformaciones_pyspark.py"
                jarFileUris:
                  - "gs://sd-gcolab-bucket-1/spark-bigquery-with-dependencies_2.12-0.30.0.jar"
        result: response

    - print-job-id:
        return: ${response.body.jobUuid}
